services:
  aicheckin:
    build:
      # 上下文设为仓库根目录，才能 COPY 根目录的 gyqd.py。
      context: .
      dockerfile: Dockerfile
    image: aicheckin:latest
    container_name: aicheckin
    # 公网部署建议改为 "127.0.0.1:5525:5525" 或内网 IP，仅本机/内网可访问。
    ports:
      - "5525:5525"
    environment:
      # 定时签到按服务器本地时间触发，设置时区以匹配北京时间。
      TZ: "Asia/Shanghai"
      # 配置文件路径（位于可写数据目录内）。
      GYQD_CONFIG_FILE: "/app/data/config.json"
      # 管理密码：保护签到执行 / 配置增删改 / 查看真实 token / 运行历史 / 定时设置。
      # 绝不要把密码写进本文件——它是要进 git 的。放到同目录的 .env（已在 .gitignore 内）：
      #     cp .env.example .env && 编辑 .env 填入强口令
      # 未设置时 compose 会直接报错退出，避免「以为设了、其实全开放」。
      GYQD_ADMIN_PASSWORD: "${GYQD_ADMIN_PASSWORD:?请先在 .env 中设置 GYQD_ADMIN_PASSWORD（见 SECURITY.md）}"
      # 反代已是 https 时可设为 1 下发 HSTS（会把整个域名锁到 https，含其它端口的服务）。
      GYQD_HSTS: "${GYQD_HSTS:-0}"
      # 收藏库默认登录后才出现（设了管理密码即私密模式）；确实要公开首页给路人看的设 1。
      HUB_PUBLIC_LIBRARY: "${HUB_PUBLIC_LIBRARY:-0}"
      # 旧开关：1 仍强制私密，0 已无作用。留着只为老 .env 不报错。
      GYQD_PRIVATE: "${GYQD_PRIVATE:-0}"
      # 后台定时调度开关，1 启用 0 关闭。
      GYQD_SCHEDULER: "1"
      # 「AI 聊天」标签页（可选）：嵌进来的 HaloWebUI 地址 + 与它共享的免登录密钥，值都放 .env。
      # 密钥由管理员部署时现场生成，绝不要写进本文件；HUB_CHAT_URL 留空 = 没有这个标签页。
      HUB_CHAT_URL: "${HUB_CHAT_URL:-}"
      HUB_TRUSTED_EMBED_ADMIN_SECRET: "${HUB_TRUSTED_EMBED_ADMIN_SECRET:-}"
      HUB_PUBLIC_ORIGIN: "${HUB_PUBLIC_ORIGIN:-}"
      # 笔记（WebObsidian，可选）：地址 + API key 放 .env。留空 = 没有这些功能。
      # key 只进请求头，绝不要写进本文件——它是要进 git 的。
      HUB_VAULT_URL: "${HUB_VAULT_URL:-}"
      HUB_VAULT_API_KEY: "${HUB_VAULT_API_KEY:-}"
      HUB_VAULT_INBOX: "${HUB_VAULT_INBOX:-收件箱}"
      HUB_VAULT_TIMEOUT: "${HUB_VAULT_TIMEOUT:-5}"
      HUB_VAULT_TODO_MIRROR: "${HUB_VAULT_TODO_MIRROR:-0}"
    volumes:
      # 挂载可写数据目录：存放 config.json 与 history.json，支持页面在线增删改。
      # 首次使用：mkdir -p data && cp config.example.json data/config.json
      # 权限：容器入口（entrypoint.sh）会以 root 自动 chown 此目录给 appuser，无需手动处理；
      # 若宿主启用了 user namespace 重映射导致仍不可写，可手动：chown -R 1000:1000 data
      - ./data:/app/data
    restart: unless-stopped
